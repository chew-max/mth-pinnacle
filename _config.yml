title: MTH Pinnacle
description: "MTH Pinnacle LLC provides wholesale and distribution solutions with dependable sourcing, responsive service, and access to a diverse range of products."

url: "https://chew-max.github.io"
baseurl: "/mth-pinnacle"

author:
  name: MTH Pinnacle LLC

logo: /assets/images/mth_logo_large.png

lang: en_US
remote_theme: dieghernan/chulapa

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

chulapa-skin:
  vars:
    primary: "#0D5FB8"
    secondary: "#C6A15B"
    dark: "#06264D"
    light: "#F6F8FB"
    
    
navbar:
  style: fab

  brand:
    title: MTH Pinnacle
    url: "/"

  nav:
    - title: Home
      url: "/"

    - title: Contact
      url: "/contact.html"
      
footer:
  copyright: "© 2026 MTH Pinnacle LLC. All Rights Reserved."
  
footer:
  copyright: "© 2026 MTH Pinnacle LLC. All Rights Reserved."

  links:
    - label: Email
      icon: "fas fa-envelope"
      url: "contact@mthpinnacle.com"

    - label: Phone
      icon: "fas fa-phone"
      url: "tel:+11234567890"

    - label: LinkedIn
      icon: "fab fa-linkedin-in"
      url: "https://www.linkedin.com/company/YOUR-COMPANY"
      
    - label: Facebook
      icon: "fab fa-facebook-f"
      url: "https://www.facebook.com/..."

    - label: Instagram
      icon: "fab fa-instagram"
      url: "https://www.instagram.com/..."
      
      
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/mth-social-card.png